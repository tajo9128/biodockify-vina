[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodockify-vina"
version = "0.1.1"
description = "Single-molecule docking workflow using AutoDock Vina"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "BioDockify Team", email = "support@biodockify.com"}
]
keywords = [
    "molecular-docking",
    "autodock-vina",
    "computational-chemistry",
    "drug-discovery",
    "bioinformatics",
    "cheminformatics",
    "structural-biology"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[project.scripts]
biodockify-vina = "biodockify_vina.cli:main"

[project.urls]
Homepage = "https://www.biodockify.com/"
Documentation = "https://www.biodockify.com/docs"
Repository = "https://github.com/tajo9128/biodockify-vina"
Issues = "https://github.com/tajo9128/biodockify-vina/issues"
"Online Docking" = "https://www.biodockify.com/molecular-docking-online"
Changelog = "https://github.com/tajo9128/biodockify-vina/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biodockify_vina = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
